# DJ PH gig manager. Opens at /admin on the live site.
# Setup steps are in the README, under "Managing gigs".

backend:
  name: github
  repo: YanderAcquisition/dj-ph-site
  branch: main
  commit_messages:
    update: "Gigs: update {{slug}}"
    uploadMedia: "Gigs: upload {{path}}"
    deleteMedia: "Gigs: delete {{path}}"

# Lets you try the admin on your own computer with `npx decap-server` (see README)
local_backend: true

logo_url: /assets/img/favicon.svg
media_folder: content/media
public_folder: /content/media

collections:
  - name: gigs
    label: Gigs
    description: Everything in the Gigs section of the site. Press Publish and the site updates in a minute or two.
    files:
      - name: guide
        label: Gig guide
        file: content/gigs.json
        description: The list on the home page and the departures board on the Gigs page. Upcoming dates move to the top on their own and switch to Played the day after.
        fields:
          - name: gigs
            label: Gigs
            label_singular: gig
            widget: list
            add_to_top: true
            collapsed: true
            summary: "{{fields.date | date('DD MMM YYYY')}}  /  {{fields.city}}  /  {{fields.event}}"
            fields:
              - name: show
                label: Show on the site
                widget: boolean
                default: true
                hint: Switch off to hide a gig without deleting it, for example if it's postponed.
              - name: date
                label: Date
                widget: datetime
                format: YYYY-MM-DD
                date_format: DD MMM YYYY
                time_format: false
              - name: precision
                label: Show the date as
                widget: select
                default: day
                options:
                  - { label: "Full date (18 Dec 2026)", value: day }
                  - { label: "Month and year (Dec 2026)", value: month }
                  - { label: "Year only (2026)", value: year }
                hint: For older gigs where you only know the month or the year, pick any day in it.
              - name: city
                label: City
                widget: string
                hint: "City and country, for example: East London, SA"
              - name: event
                label: Event and venue
                widget: string
                hint: "For example: PHola, Police Park Cricket Stadium"
              - name: times
                label: Set times
                widget: string
                required: false
                hint: "Optional, for example: 14:00 to 02:00"
              - name: tickets
                label: Ticket link
                widget: string
                required: false
                pattern: ['^(https?://\S+)?$', "Paste the full link, starting with https://"]
                hint: Optional. Upcoming gigs with a link get a Tickets button.
              - name: record
                label: Record-breaking set
                widget: boolean
                default: false
                hint: Shows a Record tag instead of Played once the date has passed.
              - name: board
                label: Departures board text
                widget: string
                required: false
                pattern: ['^.{0,19}$', "Keep it to 19 characters or fewer"]
                hint: The short version for the flip board on the Gigs page, 19 characters or fewer. Leave it empty to use the event name.

      - name: next
        label: Save the date
        file: content/next-up.json
        description: The poster, countdown and buttons beside the gig list.
        fields:
          - name: show
            label: Show the poster
            widget: boolean
            default: true
            hint: Switch off when there's no headline show coming up. The gig list then takes the full width.
          - name: intro
            label: Intro line
            widget: text
            hint: Sits next to the Gigs heading.
          - name: event
            label: Event name
            widget: string
            hint: "For example: PHola East London"
          - name: starts
            label: Gates open
            widget: datetime
            format: YYYY-MM-DDTHH:mm
            date_format: DD MMM YYYY
            time_format: HH:mm
            picker_utc: false
            required: false
            hint: South African time. The countdown hides itself once this passes.
          - name: countdown_label
            label: Countdown label
            widget: string
            default: Gates open in
          - name: poster
            label: Poster
            widget: image
            choose_url: false
            hint: Portrait posters work best. A JPG or WebP under 1 MB loads fastest.
          - name: poster_alt
            label: What the poster says
            widget: string
            hint: Read out to people using screen readers. Include the event, date and venue.
          - name: button_text
            label: Main button text
            widget: string
            default: Get the tickets
          - name: button_link
            label: Main button link
            widget: string
            pattern: ['^(https?://|mailto:)\S+$', "Paste the full link, starting with https://"]
          - name: second_text
            label: Second button text
            widget: string
            required: false
          - name: second_link
            label: Second button link
            widget: string
            required: false
            hint: A web link, or mailto:name@example.com for an email button. Leave both empty to hide it.
